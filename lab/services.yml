# scorebot services - edit for your lab. One block per scored service.
# host is an IP or name reachable from where scorebot runs.
# Spring '26 scored services are pre-filled; change the IPs (X = your team number).
- name: pfSense ICMP         # Router
  host: 172.16.21.1
  check: icmp
- name: pfSense DNS
  host: 172.16.21.1
  check: dns
  query: dog.local           # a name the resolver should answer
- name: Gitlab ICMP
  host: 172.16.21.10
  check: icmp
- name: Gitlab SSH
  host: 172.16.21.10
  check: ssh
- name: Gitlab HTTP
  host: 172.16.21.10
  check: http
  path: /users/sign_in
